<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代先生 - 前端开发工程师</title>
  <style>
    :root {
      --color-bg: #F8FAFC;
      --color-text-primary: #1E293B;
      --color-text-secondary: #64748B;
      --color-text-heading: #0F172A;
      --color-border: #E2E8F0;
      --color-accent: #3B82F6;
      --color-link: #2563EB;
      --color-card-bg: #FFFFFF;
      --color-shadow: rgba(0, 0, 0, 0.06);
      --color-skill-level-bg: #F1F5F9;
      --color-header-bg: #1E2A4A;
      --color-header-text: #fff;
      --color-header-text-secondary: rgba(255, 255, 255, 0.7);
      --color-header-text-tertiary: rgba(255, 255, 255, 0.6);
      --color-header-text-muted: rgba(255, 255, 255, 0.75);
      --color-header-icon: rgba(255, 255, 255, 0.55);
      --color-header-border: rgba(255, 255, 255, 0.1);
      --color-header-avatar-border: rgba(255, 255, 255, 0.2);
      --color-header-link: #64B5F6;
      --color-header-link-hover: #90CAF9;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    ul, ol { list-style: none; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      line-height: 1.6;
      padding: 32px 16px;
    }
    .resume {
      max-width: 960px;
      margin: 0 auto;
      background: var(--color-card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 24px var(--color-shadow);
      overflow: hidden;
    }
    /* ========== Header ========== */
    .header {
      background: var(--color-header-bg);
      color: var(--color-header-text);
      padding: 40px 40px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }
    .header-left { flex: 1; min-width: 0; }
    .header-avatar {
      width: 100px; height: 100px; border-radius: 50%;
      border: 3px solid var(--color-header-avatar-border);
      flex-shrink: 0; overflow: hidden; margin-top: 4px;
    }
    .header-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .header h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.02em; }
    .header .title {
      font-size: 15px; font-weight: 400;
      color: var(--color-header-text-secondary); margin-top: 4px; letter-spacing: 0.01em;
    }
    .header .meta {
      display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px;
      font-size: 13px; color: var(--color-header-text-tertiary);
    }
    .header .meta-sep { opacity: 0.35; }
    .header .contact {
      display: flex; flex-wrap: wrap; gap: 20px 28px; margin-top: 16px;
      padding-top: 16px; border-top: 1px solid var(--color-header-border);
      font-style: normal;
    }
    .header .contact-item {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--color-header-text-muted);
    }
    .header .contact-item .icon { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; }
    .header .contact-item .icon svg { width: 14px; height: 14px; fill: none; stroke: var(--color-header-icon); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .header .contact-item .icon.icon-fill svg { fill: var(--color-header-icon); stroke: none; }
    .header .contact-item .icon img { width: 14px; height: 14px; border-radius: 2px; display: block; }
    .header .contact-item a { color: var(--color-header-link); text-decoration: none; transition: color 0.2s; }
    .header .contact-item a:hover { color: var(--color-header-link-hover); }
    /* ========== Section ========== */
    .section { padding: 28px 40px; }
    .section-title {
      font-size: 24px; font-weight: 600; color: var(--color-text-heading);
      letter-spacing: 0.02em; margin-bottom: 16px; padding-left: 16px; position: relative;
    }
    .section-title::before {
      content: ''; position: absolute; left: 0; top: 8px;
      width: 4px; height: 20px; border-radius: 2px; background: var(--color-accent);
    }
    .section-title::after {
      content: ''; display: block; width: 100%; height: 1px;
      background: var(--color-border); margin-top: 10px;
    }
    /* ========== Summary ========== */
    .summary ul { padding-left: 0; list-style: none; }
    .summary ul li {
      font-size: 14px; line-height: 1.8; position: relative;
      padding-left: 16px; margin-bottom: 3px;
    }
    .summary ul li::before {
      content: ''; position: absolute; left: 0; top: 11px;
      width: 5px; height: 5px; border-radius: 50%; background: var(--color-accent);
    }
    /* ========== Intention ========== */
    .intention-grid {
      display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 14px;
      color: var(--color-text-primary);
    }
    .intention-grid li:not(:first-child)::before {
      content: '·'; color: var(--color-text-secondary);
      opacity: 0.4; margin-right: 24px;
    }
    /* ========== Skills ========== */
    .skill-groups { display: flex; flex-direction: column; gap: 20px; }
    .skill-group-title {
      font-size: 13px; font-weight: 600; color: var(--color-text-heading);
      margin-bottom: 8px; padding-left: 10px; position: relative;
    }
    .skill-group-title::before {
      content: ''; position: absolute; left: 0; top: 4px;
      width: 3px; height: 14px; border-radius: 2px; background: var(--color-accent);
    }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-tag {
      font-size: 13px; color: var(--color-text-primary);
      background: var(--color-skill-level-bg);
      padding: 4px 12px; border-radius: 4px; line-height: 1.5;
    }
    /* ========== Experience / Project ========== */
    .entry { margin-bottom: 22px; }
    .entry:last-child { margin-bottom: 0; }
    .entry-header {
      display: flex; justify-content: space-between; align-items: baseline;
      flex-wrap: wrap; gap: 4px 12px;
    }
    .entry-header .entry-name { font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
    .entry-header .entry-date { font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
    .entry-sub { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
    .entry-tech { margin-top: 8px; font-size: 13px; color: var(--color-text-secondary); }
    .entry-highlights { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .entry-highlight-tag {
      font-size: 11px; font-weight: 500; color: #8B5CF6;
      background: rgba(139, 92, 246, 0.08); padding: 2px 10px;
      border-radius: 3px; line-height: 1.8;
    }
    .entry-desc { margin-top: 8px; padding-left: 0; list-style: none; }
    .entry-desc li {
      font-size: 14px; line-height: 1.7; position: relative;
      padding-left: 14px; margin-bottom: 4px;
    }
    .entry-desc li::before {
      content: ''; position: absolute; left: 0; top: 10px;
      width: 4px; height: 4px; border-radius: 50%; background: var(--color-accent);
    }
    /* ========== Portfolio ========== */
    .portfolio-items { display: flex; flex-direction: column; gap: 6px; }
    .portfolio-item {
      font-size: 14px; display: inline-flex; align-items: center;
      gap: 6px; flex-wrap: wrap;
    }
    .portfolio-item .icon { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; flex-shrink: 0; }
    .portfolio-item .icon svg { width: 13px; height: 13px; fill: none; stroke: var(--color-text-secondary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .portfolio-item a { color: var(--color-link); text-decoration: none; font-weight: 500; }
    .portfolio-item a:hover { text-decoration: underline; }
    .portfolio-item .portfolio-desc { color: var(--color-text-secondary); }
    .portfolio-item .portfolio-url { width: 100%; font-size: 12px; color: var(--color-text-secondary); word-break: break-all; }
    .portfolio-item .portfolio-url a { color: var(--color-text-secondary); font-weight: 400; text-decoration: none; }
    .portfolio-item .portfolio-url a:hover { color: var(--color-link); }
    /* ========== Education ========== */
    .edu-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
    .edu-row .edu-school { font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
    .edu-row .edu-major { font-size: 14px; color: var(--color-text-primary); }
    .edu-row .edu-date { font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
    /* ========== Responsive ========== */
    @media (max-width: 767px) {
      body { padding: 0; }
      .resume { border-radius: 0; box-shadow: none; }
      .header { padding: 28px 20px 24px; gap: 16px; }
      .header-avatar { width: 80px; height: 80px; align-self: flex-start; }
      .header h1 { font-size: 24px; }
      .section { padding: 20px; }
      .entry-header { flex-direction: column; align-items: flex-start; }
      .edu-row { flex-direction: column; align-items: flex-start; }
    }
    /* ========== Loading ========== */
    .loading-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 999;
      transition: opacity 0.35s ease;
    }
    .loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loading-container.hidden {
      display: none;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    /* ========== Content fade-in ========== */
    .content-fade {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .content-fade.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media print {
      @page { margin: 12mm 15mm; }
      body { background: var(--color-card-bg); padding: 0; font-size: 12px; }
      .resume { max-width: 100%; box-shadow: none; border-radius: 0; }
      .header { padding: 24px 32px 20px; break-inside: avoid; flex-direction: row; align-items: flex-start; }
      .header-avatar { align-self: flex-start; }
      .header h1 { font-size: 24px; }
      .section { padding: 16px 32px; page-break-inside: auto; }
      .section-title { font-size: 18px; margin-bottom: 10px; }
      .section-title::after { margin-top: 6px; }
      .entry { break-inside: avoid; margin-bottom: 14px; }
      .entry-desc li { font-size: 12px; line-height: 1.5; }
      .entry-highlight-tag { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .summary ul li { font-size: 12px; line-height: 1.5; }
      .intention-grid { font-size: 12px; gap: 4px 16px; }
      .portfolio-item { font-size: 12px; }
    }
  </style>

  <script id="resume-tpl" type="text/html">
    <main class="resume">

            <li>{{meta.education}}</li>
            <li>{{meta.status}}</li>
            <li>{{meta.location}}</li>
          </ul>
          <address class="contact">
            {{each contacts}}
            <span class="contact-item">
              <span class="icon{{$value.iconFill ? ' icon-fill' : ''}}">{{@ $value.iconHtml}}</span>
              <a href="{{$value.href}}"{{$value.target ? ' target="_blank"' : ''}}>{{$value.text}}</a>
            </span>
            {{/each}}
          </address>
        </div>
        <div class="header-avatar">
          <img src="{{avatar}}" alt="avatar" />
        </div>
      </header>
      <!-- ====== 个人优势 ====== -->
      <section class="section">
        <h2 class="section-title">个人优势</h2>
        <div class="summary">
          <ul>
            {{each summary}}
            <li>{{$value}}</li>
            {{/each}}
          </ul>
        </div>
      </section>
      <!-- ====== 求职意向 ====== -->
      <section class="section">
        <h2 class="section-title">求职意向</h2>
        <ul class="intention-grid">
          {{each intention}}
          <li>{{$value}}</li>
          {{/each}}
        </ul>
      </section>
      <!-- ====== 专业技能 ====== -->
      <section class="section">
        <h2 class="section-title">专业技能</h2>
        <div class="skill-groups">
          {{each skills}}
          <div class="skill-group">
            <h3 class="skill-group-title">{{$value.title}}</h3>
            <ul class="skill-tags">
              {{each $value.tags}}
              <li class="skill-tag">{{$value}}</li>
              {{/each}}
            </ul>
          </div>
          {{/each}}
        </div>
      </section>
      <!-- ====== 工作经历 ====== -->
      <section class="section">
        <h2 class="section-title">工作经历</h2>
        {{each experiences}}
        <article class="entry">
          <header class="entry-header">
            <h3 class="entry-name">{{$value.company}}</h3>
            <time class="entry-date">{{$value.date}}</time>
          </header>
          <div class="entry-sub">{{$value.role}}</div>
          <ul class="entry-desc">
            {{each $value.descriptions}}
            <li>{{$value}}</li>
            {{/each}}
          </ul>
        </article>
        {{/each}}
      </section>
      <!-- ====== 项目经历 ====== -->
      <section class="section">
        <h2 class="section-title">项目经历</h2>
        {{each projects}}
        <article class="entry">
          <header class="entry-header">
            <h3 class="entry-name">{{$value.name}}</h3>
            <time class="entry-date">{{$value.date}}</time>
          </header>
          <div class="entry-sub">{{$value.role}}</div>
          <ul class="entry-desc">
            {{each $value.descriptions}}
            <li>{{$value}}</li>
            {{/each}}
          </ul>
          {{if $value.tech}}
          <p class="entry-tech">{{$value.tech}}</p>
          {{/if}}
          {{if $value.highlights && $value.highlights.length}}
          <ul class="entry-highlights">
            {{each $value.highlights}}
            <li class="entry-highlight-tag">{{$value}}</li>
            {{/each}}
          </ul>
          {{/if}}
        </article>
        {{/each}}
      </section>
      <!-- ====== 教育背景 ====== -->
      <section class="section">
        <h2 class="section-title">教育背景</h2>
        <article class="entry">
          <div class="edu-row">
            <h3 class="edu-school">{{education.school}}</h3>
            <span class="edu-major">{{education.major}}</span>
            <span class="edu-date">{{education.date}}</span>
          </div>
        </article>
      </section>
      <!-- ====== 个人作品 ====== -->
      <section class="section">
        <h2 class="section-title">个人作品</h2>
        <ul class="portfolio-items">
          {{each portfolios}}
          <li class="portfolio-item">
            <span class="icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
            </span>
            <a href="{{$value.url}}" target="_blank">{{$value.name}}</a>
            <span class="portfolio-desc">— {{$value.desc}}</span>
            <span class="portfolio-url"><a href="{{$value.url}}" target="_blank">{{$value.url}}</a></span>
          </li>
          {{/each}}
        </ul>
      </section>
    </main>
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 1. 使用 art-template 将数据渲染到模板
      var html = template('resume-tpl', resumeData)
      var app = document.getElementById('app')
      var loading = document.getElementById('loading')

      if (!app) {
        throw new Error('app element not found')
      }

      app.innerHTML = html

      // 2. 延迟片刻再播放动画，避免闪烁
      window.setTimeout(function () {
        if (!loading) {
          throw new Error('loading element not found')
        }

        // loading 淡出
        loading.classList.add('fade-out')
        // 内容淡入 + 上移
        app.classList.add('visible')
        // 等待 loading 淡出动画结束后完全隐藏
        window.setTimeout(function () {
          loading.classList.add('hidden')
        }, 150)
      }, 400)
    })
  </script>
